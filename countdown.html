<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👹 Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0005;
    --surface: #110008;
    --accent: #ff2a2a;
    --accent2: #ff8c00;
    --text: #f0e8e8;
    --muted: #6b4a4a;
    --border: #2a1010;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Demonic ambient glow */
  body::before {
    content: '';
    position: fixed;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(255,42,42,0.08) 0%, transparent 65%);
    top: -200px; right: -150px;
    border-radius: 50%;
    pointer-events: none;
    animation: flicker 4s ease-in-out infinite;
  }
  body::after {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,140,0,0.06) 0%, transparent 65%);
    bottom: -150px; left: -150px;
    border-radius: 50%;
    pointer-events: none;
    animation: flicker 6s ease-in-out infinite reverse;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; transform: scale(1); }
    33% { opacity: 0.6; transform: scale(1.05); }
    66% { opacity: 0.9; transform: scale(0.97); }
  }

  /* Floating 👹 particles */
  .particle {
    position: fixed;
    font-size: 1.4rem;
    opacity: 0;
    pointer-events: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.5); }
    10%  { opacity: 0.4; }
    80%  { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(-100vh) rotate(360deg) scale(1.2); }
  }

  /* SETUP SCREEN */
  #setup {
    width: 100%;
    max-width: 520px;
    padding: 48px 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    position: relative;
    animation: fadeUp 0.6s ease both;
    box-shadow: 0 0 60px rgba(255,42,42,0.07);
  }

  #setup h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 4px;
    text-shadow: 0 0 30px rgba(255,42,42,0.5);
  }

  #setup p.sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 36px;
  }

  .field { margin-bottom: 20px; }

  .field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field input[type="text"],
  .field input[type="datetime-local"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(255,42,42,0.15);
  }

  .field input[type="datetime-local"]::-webkit-calendar-picker-indicator {
    filter: invert(0.4) sepia(1) hue-rotate(300deg);
    cursor: pointer;
  }

  .btn-primary {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 2px;
    cursor: pointer;
    margin-top: 12px;
    transition: transform 0.15s, opacity 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 24px rgba(255,42,42,0.3);
  }

  .btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(255,42,42,0.45);
  }
  .btn-primary:active { transform: translateY(0); }

  /* SHARE BOX */
  #shareBox {
    display: none;
    margin-top: 24px;
    padding: 16px;
    background: rgba(255,42,42,0.06);
    border: 1px solid rgba(255,42,42,0.2);
    border-radius: 10px;
  }

  #shareBox p {
    font-size: 0.78rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .share-row { display: flex; gap: 8px; }

  #shareUrl {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--muted);
    font-size: 0.82rem;
    outline: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-copy {
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .btn-copy:hover { opacity: 0.8; }

  /* COUNTDOWN SCREEN */
  #countdown {
    display: none;
    width: 100%;
    max-width: 960px;
    padding: 40px 24px;
    text-align: center;
    animation: fadeUp 0.8s ease both;
  }

  .demon-icon {
    font-size: clamp(3rem, 8vw, 6rem);
    display: block;
    margin-bottom: 16px;
    animation: demonBob 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,42,42,0.6));
  }

  @keyframes demonBob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }

  #eventTitle {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 6vw, 4.5rem);
    letter-spacing: 4px;
    color: var(--text);
    margin-bottom: 12px;
    line-height: 1;
    text-shadow: 0 0 40px rgba(255,42,42,0.3);
  }

  #targetDateDisplay {
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 50px;
  }

  .progress-wrap {
    width: 100%;
    max-width: 500px;
    margin: 0 auto 50px;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 1s linear;
    box-shadow: 0 0 10px rgba(255,42,42,0.5);
  }

  .timer-grid {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: clamp(8px, 3vw, 32px);
    flex-wrap: wrap;
    margin-bottom: 60px;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .unit-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 12vw, 9rem);
    line-height: 1;
    color: var(--text);
    min-width: clamp(80px, 18vw, 200px);
    text-align: center;
    position: relative;
    transition: color 0.3s, text-shadow 0.3s;
  }

  .unit-value::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 80%; height: 2px;
    background: var(--border);
  }

  .unit-label {
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 14px;
  }

  .sep {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 10vw, 7rem);
    color: var(--border);
    line-height: 1;
    padding-bottom: 24px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.1; }
  }

  .flash {
    color: var(--accent) !important;
    text-shadow: 0 0 20px rgba(255,42,42,0.7) !important;
    transition: color 0.05s !important;
  }

  #expiredMsg {
    display: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 8vw, 5rem);
    letter-spacing: 6px;
    color: var(--accent);
    animation: demonPulse 1.5s ease infinite;
    text-shadow: 0 0 40px rgba(255,42,42,0.8);
  }

  @keyframes demonPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.04); }
  }

  .btn-reset {
    padding: 12px 28px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 1px;
    transition: color 0.2s, border-color 0.2s;
    margin-top: 12px;
  }

  .btn-reset:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    #setup { padding: 32px 24px; margin: 16px; }
    .sep { display: none; }
    .timer-grid { gap: 12px; }
  }
</style>
</head>
<body>

<script>
  // Spawn floating demon particles
  const emojis = ['👹','👹','👹','🔥','💀','😈'];
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = (20 + Math.random() * 80) + 'vh';
    el.style.animationDelay = (Math.random() * 12) + 's';
    el.style.animationDuration = (10 + Math.random() * 14) + 's';
    document.body.appendChild(el);
  }
</script>

<!-- SETUP SCREEN -->
<div id="setup">
  <h1>👹 COUNTDOWN</h1>
  <p class="sub">Set an event, share the link with anyone</p>

  <div class="field">
    <label>Event Name</label>
    <input type="text" id="titleInput" placeholder="e.g. Birthday, Race Day, Trip..." />
  </div>

  <div class="field">
    <label>Target Date & Time</label>
    <input type="datetime-local" id="dateInput" />
  </div>

  <button class="btn-primary" onclick="generate()">👹 GENERATE LINK</button>

  <div id="shareBox">
    <p>Link is ready — copy & share</p>
    <div class="share-row">
      <input type="text" id="shareUrl" readonly />
      <button class="btn-copy" onclick="copyLink()">Copy</button>
    </div>
  </div>
</div>

<!-- COUNTDOWN SCREEN -->
<div id="countdown">
  <span class="demon-icon">👹</span>
  <div id="eventTitle"></div>
  <div id="targetDateDisplay"></div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <div class="timer-grid" id="timerGrid">
    <div class="unit">
      <div class="unit-value" id="days">00</div>
      <div class="unit-label">Days</div>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="unit-value" id="hours">00</div>
      <div class="unit-label">Hours</div>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="unit-value" id="minutes">00</div>
      <div class="unit-label">Minutes</div>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="unit-value" id="seconds">00</div>
      <div class="unit-label">Seconds</div>
    </div>
  </div>

  <div id="expiredMsg">👹 IT'S TIME! 👹</div>

  <button class="btn-reset" onclick="reset()">← New Countdown</button>
</div>

<script>
  let interval = null;
  let targetTimestamp = null;
  let createdAt = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function generate() {
    const title = document.getElementById('titleInput').value.trim();
    const dateVal = document.getElementById('dateInput').value;

    if (!title) { alert('Enter an event name'); return; }
    if (!dateVal) { alert('Pick a target date & time'); return; }

    const target = new Date(dateVal).getTime();
    if (target <= Date.now()) { alert('Date must be in the future'); return; }

    const params = new URLSearchParams({ t: title, d: target, c: Date.now() });
    const url = window.location.href.split('?')[0] + '?' + params.toString();
    document.getElementById('shareUrl').value = url;
    document.getElementById('shareBox').style.display = 'block';

    startCountdown(title, target, Date.now());
  }

  function copyLink() {
    const url = document.getElementById('shareUrl').value;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.querySelector('.btn-copy');
      btn.textContent = '✓ Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    });
  }

  function startCountdown(title, target, created) {
    targetTimestamp = target;
    createdAt = created;

    document.getElementById('setup').style.display = 'none';
    document.getElementById('countdown').style.display = 'block';
    document.getElementById('eventTitle').textContent = title;

    const d = new Date(target);
    const opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    document.getElementById('targetDateDisplay').textContent = d.toLocaleDateString('en-US', opts);

    tick();
    interval = setInterval(tick, 1000);
  }

  function tick() {
    const now = Date.now();
    const diff = targetTimestamp - now;

    if (diff <= 0) {
      clearInterval(interval);
      document.getElementById('timerGrid').style.display = 'none';
      document.getElementById('expiredMsg').style.display = 'block';
      document.getElementById('progressBar').style.width = '100%';
      return;
    }

    const totalDuration = targetTimestamp - createdAt;
    const elapsed = now - createdAt;
    const pct = Math.min(100, (elapsed / totalDuration) * 100);
    document.getElementById('progressBar').style.width = pct + '%';

    setUnit('days',    pad(Math.floor(diff / 86400000)));
    setUnit('hours',   pad(Math.floor((diff % 86400000) / 3600000)));
    setUnit('minutes', pad(Math.floor((diff % 3600000) / 60000)));
    setUnit('seconds', pad(Math.floor((diff % 60000) / 1000)));
  }

  const prevValues = {};
  function setUnit(id, val) {
    const el = document.getElementById(id);
    if (prevValues[id] !== val) {
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 200);
      prevValues[id] = val;
    }
    el.textContent = val;
  }

  function reset() {
    clearInterval(interval);
    document.getElementById('countdown').style.display = 'none';
    document.getElementById('setup').style.display = 'block';
    document.getElementById('timerGrid').style.display = 'flex';
    document.getElementById('expiredMsg').style.display = 'none';
    document.getElementById('shareBox').style.display = 'none';
    history.replaceState(null, '', window.location.pathname);
  }

  // Auto-load from URL params
  (function() {
    const p = new URLSearchParams(window.location.search);
    if (p.has('t') && p.has('d')) {
      startCountdown(p.get('t'), parseInt(p.get('d')), parseInt(p.get('c') || Date.now()));
    }
  })();
</script>
</body>
</html>
